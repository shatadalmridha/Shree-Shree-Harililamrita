.toc a{display:block;padding:.45rem .2rem;border-bottom:1px dotted var(--rule);color:var(--ink);text-decoration:none}.toc b{font-weight:600}.toc small{display:block;color:var(--soft);font-size:.88rem;line-height:1.5}
.toc a.tl{display:flex;align-items:baseline;gap:.4rem;padding:.25rem .1rem;border:0}.tl i{flex:1 1 1rem;min-width:1rem;border-bottom:1px dotted var(--rule)}.tl em{flex:0 0 2.8rem;text-align:right;font-style:normal;color:var(--soft)}.toc a.ct{margin-top:.3rem;border-bottom:1px solid var(--rule);font-size:1.08em}.toc a.ct em{color:var(--ink)}.sl{margin:.2rem 0 .8rem;padding:0 0 0 1.5rem;list-style:disc}.sl li::marker{color:var(--saf)}.sl a{font-size:.93em;line-height:1.55}.part{text-align:center;color:var(--soft);margin:0}.leaf h1{font:400 2.1rem/1.3 var(--fd);color:var(--sin);text-align:center;margin:.1rem 0 1rem}

.tag{text-align:center;margin:.2rem 0 .7rem}.tag span,.ul{position:relative;display:inline-block;padding:0 .9rem .5rem}.tag span{color:var(--saf);font-size:.95rem}.tag span::after,.ul::after{content:"";position:absolute;left:0;right:0;bottom:.15rem;height:2px;background:linear-gradient(90deg,transparent,var(--sin) 22%,var(--sin) 78%,transparent)}.tag span::before,.ul::before{content:"";position:absolute;left:50%;bottom:.15rem;width:.45rem;height:.45rem;background:var(--saf);transform:translate(-50%,50%) rotate(45deg);z-index:1}
.v{margin:.1rem 0}.v.e,.tri.e{margin-bottom:.9rem}.v.hit{background:var(--hit)}.leaf{text-align:center}.tri{margin:.25rem 0}.tr1{display:flex;flex-wrap:wrap;justify-content:center;column-gap:2.6em}.tr2{margin-top:.05rem}
.nav{display:flex;justify-content:space-between;margin-top:2.5rem;border-top:2px double var(--sin);padding-top:1rem}
.bk{position:relative;perspective:1700px;touch-action:none;user-select:none;width:min(100% - 1rem,36rem);margin:.4rem auto;height:calc(100vh - var(--hh) - 1.5rem - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - var(--hh) - 1.5rem - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.pg{position:absolute;inset:0;overflow:hidden;padding:1rem .8rem 2.4rem;background:var(--paper) var(--tex);border:1px solid var(--rule);border-radius:2px 7px 7px 2px;box-shadow:0 3px 14px rgba(0,0,0,.3),inset 14px 0 18px -14px rgba(0,0,0,.35)}
.pg.out{transform:rotateY(-105deg);box-shadow:0 0 40px rgba(0,0,0,.5)}.pg .in{height:100%}.cols{display:grid;grid-template-columns:1fr 1fr;height:100%}.cols.one{grid-template-columns:1fr}.col{padding:0 .6rem;min-width:0}.col+.col{background:linear-gradient(var(--rule),var(--rule)) left/1px 100% no-repeat}.col>:first-child{margin-top:0}.c2 .in{font-size:calc(var(--fs)*.84)}
.pf{position:absolute;left:0;right:0;bottom:.6rem;text-align:center;font-size:.8rem;color:var(--soft)}
.res a{display:block;padding:.5rem .2rem;border-bottom:1px dotted var(--rule);color:var(--ink);text-decoration:none;line-height:1.6}.res small{display:block;color:var(--soft);font-size:.82rem}mark{background:var(--hit);color:inherit}
input#q{display:block;width:100%;height:3.2rem;padding:0 .9rem;font:inherit;font-size:1.05rem;line-height:1.5;color:var(--ink);background:color-mix(in srgb,var(--paper) 94%,var(--ink));border:1px solid var(--rule);border-radius:3px;-webkit-appearance:none;appearance:none}#q::placeholder{color:var(--soft);opacity:1}.foot{color:var(--soft);font-size:.85rem;text-align:center;margin-top:2rem}
.lt{text-align:left;overflow-x:auto;padding:.3rem 0 1rem}.nm{display:inline-block;line-height:1.5;padding:.1rem .6rem;margin:.18rem 0;border:1px solid var(--rule);background:var(--paper)}.nm.me{border:2px solid var(--sin);color:var(--sin);font-weight:700;font-size:1.2em;background:var(--hit)}.kids{margin:0 0 0 .4rem;padding-left:.9rem;border-left:2px solid var(--saf)}.kids>.nd{position:relative}.kids>.nd::before{content:"";position:absolute;left:-.9rem;top:1.1rem;width:.8rem;border-top:2px solid var(--saf)}.kids.one{margin-left:.9rem;padding:0;border:0}.kids.one>.nd::before{display:none}.kids.one>.nd>.nm::before{content:"↓ ";color:var(--saf)}.sm p{margin:.4rem 0;line-height:1.7;text-align:left}

.pn[hidden]{display:none}.pn h3{margin:0 0 .5rem;font:1.2rem var(--fd);color:var(--sin)}.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:.35rem;margin-bottom:.7rem}

</style></head><body>
<header><a class="brand" href="#"><img src="logo.webp" alt=""><span>শ্রী শ্রী হরিলীলামৃত</span></a><div class="tools"><button id="bc" class="tb">☰ সূচি</button><button id="fa" aria-label="লেখা ছোট">অ−</button><button id="fb" aria-label="লেখা বড়">অ+</button><button id="bs">খুঁজুন</button><button id="bm">বই</button><button id="bt">থিম</button></div></header>
<div id="app"></div><div class="pn" id="pn" hidden></div>
<script src="data.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
<script>
const D=window.HL,$=s=>document.querySelector(s),A=$('#app'),R=document.documentElement,B=document.body;
const E=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const S={g(k,d){try{const v=localStorage.getItem('hl_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},s(k,v){try{localStorage.setItem('hl_'+k,JSON.stringify(v))}catch(e){}}};
const chs=[];D.parts.forEach(p=>p.ch.forEach(c=>chs.push({p:p.n,...c})));
const TH=[['পুরোনো কাগজ','#e9d6ac','#2a1b0e','#8b2316'],['সাদা পাতা','#fbfaf6','#1d1d1d','#8b2316'],['হলুদ পাতা','#f4e7b5','#3a2a10','#a0471a'],['গেরুয়া','#e8b45e','#2b1604','#7a1d0f'],['তুলসী','#dfe6cf','#22301a','#6a3a10'],['চন্দন','#efd8c3','#3b2314','#8b3a2a'],['রাত','#1c140c','#eadcc0','#e0735a'],['মধ্যরাত','#0d0d0d','#cfcfcf','#d8a24a']];
let th=S.g('th',null)||{b:TH[0][1],f:TH[0][2],a:TH[0][3]},fs=S.g('fs',1.18),mode=S.g('mode','book'),cols=S.g('cols',2),cc=0,pi=0,busy=0,cache={};
function applyTh(){R.style.setProperty('--paper',th.b);R.style.setProperty('--ink',th.f);R.style.setProperty('--sin',th.a);S.s('th',th)}
function setfs(v){fs=Math.min(1.7,Math.max(.95,v));R.style.setProperty('--fs',fs+'rem');S.s('fs',fs);relayout()}
function relayout(){if(B.classList.contains('book')&&$('#bk')){const g=cache[cc]&&cache[cc][pi];cache={};chapterBook(cc,g&&g.k[0])}}
applyTh();setfs(fs);
const modeLbl=()=>$('#bm').textContent=mode==='book'?'স্ক্রল':'বই';modeLbl();
$('#bm').onclick=()=>{mode=mode==='book'?'scroll':'book';S.s('mode',mode);modeLbl();if(/^#c\d+/.test(location.hash))chapter(cc)};
$('#fa').onclick=()=>setfs(fs-.1);$('#fb').onclick=()=>setfs(fs+.1);$('#bc').onclick=()=>location.hash='t';$('#bs').onclick=()=>location.hash='s';
function panel(){const p=$('#pn');p.innerHTML=`<h3>থিম</h3><div class="sw">${TH.map((t,i)=>`<button data-i="${i}" style="background:${t[1]};color:${t[2]};border-color:${t[3]}">অ<small>${t[0]}</small></button>`).join('')}</div>
<label>পটভূমির রঙ<input type="color" id="cb" value="${th.b}"></label><label>লেখার রঙ<input type="color" id="cf" value="${th.f}"></label><label>শিরোনামের রঙ<input type="color" id="ca" value="${th.a}"></label>
<label>লেখার মাপ<span><button id="fm">অ−</button> <button id="fp">অ+</button></span></label><label>বই মোডে কলাম<span><button id="c1">১টি</button> <button id="c2b">২টি</button></span></label><div class="acts"><button id="cl">বন্ধ করুন</button></div>`;
p.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{const t=TH[b.dataset.i];th={b:t[1],f:t[2],a:t[3]};applyTh();panel()});
[['cb','b'],['cf','f'],['ca','a']].forEach(([i,k])=>$('#'+i).oninput=e=>{th[k]=e.target.value;applyTh()});
$('#c1').onclick=()=>{cols=1;S.s('cols',1);relayout()};$('#c2b').onclick=()=>{cols=2;S.s('cols',2);relayout()};$('#fm').onclick=()=>setfs(fs-.1);$('#fp').onclick=()=>setfs(fs+.1);$('#cl').onclick=()=>p.hidden=true}
$('#bt').onclick=()=>{const p=$('#pn');if(p.hidden){panel();p.hidden=false}else p.hidden=true};

function route(){const x=location.hash.slice(1);B.classList.remove('book');A.className='wrap';$('#pn').hidden=true;
if(x==='s')return search();if(x==='b')return intro();if(x==='d')return ajna();if(x==='a')return about();if(x==='v')return lin();if(x==='t')return toc();
const m=x.match(/^c(\d+)(?:\/(\d+-\d+))?$/);if(m)return chapter(+m[1],m[2],!!m[2]&&!/-0$/.test(m[2]));A.className='';cover();scrollTo(0,0)}
addEventListener('hashchange',route);
addEventListener('keydown',e=>{if(!$('#bk'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();turn(1)}if(['ArrowLeft','PageUp'].includes(e.key))turn(-1)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(relayout,300)});
let tm;addEventListener('scroll',()=>{if(mode!=='scroll'||!/^#c\d+/.test(location.hash))return;clearTimeout(tm);tm=setTimeout(()=>{const e=document.elementFromPoint(innerWidth/2,90),v=e&&e.closest&&e.closest('.v');if(v)S.s('last',{c:cc,k:v.id.slice(1)})},400)},{passive:true});
if(document.fonts){document.fonts.ready.then(()=>relayout());if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',()=>{if(!busy)relayout()})}
route();
</script></body></html>
